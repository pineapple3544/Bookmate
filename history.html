<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>교환독서 히스토리 · 책릴레이</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header class="top"><a class="back" href="room-complete.html"><i data-lucide="chevron-left"></i></a><h1>교환독서 히스토리</h1></header>
<div class="pad stack">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="cover md navy flex-shrink-0">
      <span>아몬드</span>
      <span>손원평</span>
    </div>
    <div>
      <h2 class="serif fs-4 mb-1 text-dark">아몬드</h2>
      <p class="xs muted mb-0">3명 · 8월 24일 ~ 9월 13일</p>
    </div>
  </div>
  <p class="fw-bold mb-2" style="font-size:14px">책 전달 과정</p>

  <!-- 1. soiewer 카드 -->
  <div class="card p-3 mb-3 border shadow-sm" style="overflow: visible;">
    <p class="fw-bold mb-1" style="font-size:14px">1. soiewer</p>
    <p class="xs muted mb-2">8월 24일 → 9월 1일</p>
    <div class="d-flex align-items-center gap-2">
      <div class="dur flex-grow-1" style="height:6px; background:var(--soft); border-radius:9px; overflow:hidden;">
        <i style="display:block; height:100%; width:100%; background:var(--ok); border-radius:9px;"></i>
      </div>
      <span class="xs muted" style="flex-shrink:0; width:28px; text-align:right;">8일</span>
    </div>
  </div>

  <!-- 2. 민지 카드 -->
  <div class="card p-3 mb-3 border shadow-sm" style="overflow: visible;">
    <p class="fw-bold mb-1" style="font-size:14px">2. 민지</p>
    <p class="xs muted mb-2">9월 1일 → 9월 8일</p>
    <div class="d-flex align-items-center gap-2">
      <div class="dur flex-grow-1" style="height:6px; background:var(--soft); border-radius:9px; overflow:hidden;">
        <i style="display:block; height:100%; width:85%; background:var(--ok); border-radius:9px;"></i>
      </div>
      <span class="xs muted" style="flex-shrink:0; width:28px; text-align:right;">7일</span>
    </div>
  </div>

  <!-- 3. 수빈 카드 -->
  <div class="card p-3 mb-3 border shadow-sm" style="overflow: visible;">
    <p class="fw-bold mb-1" style="font-size:14px">3. 수빈</p>
    <p class="xs muted mb-2">9월 8일 → 9월 13일</p>
    <div class="d-flex align-items-center gap-2">
      <div class="dur flex-grow-1" style="height:6px; background:var(--soft); border-radius:9px; overflow:hidden;">
        <i style="display:block; height:100%; width:60%; background:var(--ok); border-radius:9px;"></i>
      </div>
      <span class="xs muted" style="flex-shrink:0; width:28px; text-align:right;">5일</span>
    </div>
  </div>
  <p style="font-weight:500;margin-top:24px">모두의 감상평</p>
  <div class="card mb-3"><div class="row"><b class="sm grow">soiewer</b><span class="static-stars">★★★★<em>★</em></span></div><p class="serif" style="font-weight:700;margin-top:4px">감정을 배우는 소년의 성장기</p><p class="quote">“누구나 각자의 방식으로 사랑한다”</p></div>
  <div class="card mb-3"><div class="row"><b class="sm grow">민지</b><span class="static-stars">★★★★★</span></div><p class="serif" style="font-weight:700;margin-top:4px">조용하지만 오래 남는 이야기</p><p class="quote">“삶은 원래 다 그런 거야”</p></div>
  <div class="card mb-3"><div class="row"><b class="sm grow">수빈</b><span class="static-stars">★★★★<em>★</em></span></div><p class="serif" style="font-weight:700;margin-top:4px">곤이라는 인물이 잊히지 않는다</p><p class="quote">“나는 아몬드가 작다”</p></div>
</div>
