name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      CORE_DB_TEST: "1"
      CHAT_DB_TEST: "1"
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Local browser test without API or DB
        run: |
          node apps/room-prototype/server.js > /tmp/bookmate-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          npm run test:browser -w @bookmate/room-prototype
          npm run test:legacy-browser -w @bookmate/room-prototype
      - name: Authenticated browser integration
        env:
          WEB_ORIGINS: http://127.0.0.1:5173
          API_ORIGIN: http://127.0.0.1:3000
        run: |
          node apps/server/dist/index.js > /tmp/bookmate-api.log 2>&1 &
          API_PID=$!
          node apps/room-prototype/server.js > /tmp/bookmate-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/health/ready > /dev/null && curl --fail --silent http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          npm run test:server-browser -w @bookmate/room-prototype
          npm run test:exchange-browser -w @bookmate/room-prototype
          npm run test:p2p-browser -w @bookmate/room-prototype
          node apps/room-prototype/test/ten-readers.mjs
