<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아몬드 · 책릴레이</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <!-- 상단 헤더 -->
  <header class="top">
    <a class="back" href="home.html"><i data-lucide="chevron-left"></i></a>
    <h1>아몬드</h1>
    <span class="view"><summary style="list-style:none">나 (soiewer)</summary></span>
  </header>

  <!-- 본문 컨테이너 -->
  <div class="pad stack">
    <!-- 교환독서 완료 현황 카드 -->
    <div class="card">
      <div class="d-flex align-items-center mb-2">
        <b class="flex-grow-1" style="font-weight:500">교환독서 완료!</b>
        <span class="xs muted">3/3 완독</span>
      </div>
      <ol class="steps">
        <li><span class="num done">1</span><span class="grow me">soiewer (나)</span><span class="xs muted">8일</span><span class="badge b-done">완독</span></li>
        <li><span class="num done">2</span><span class="grow">민지</span><span class="xs muted">7일</span><span class="badge b-done">완독</span></li>
        <li><span class="num done">3</span><span class="grow">수빈</span><span class="xs muted">5일</span><span class="badge b-done">완독</span></li>
      </ol>
    </div>

    <!-- 완료 알림 배너 & 가로 나란히 버튼 2개 -->
    <div class="finish">
      <p class="mb-0">모두의 교환독서가 끝났어요</p>
      <div class="d-flex gap-2 mt-3">
        <a href="history.html" class="btn ok" style="flex:1">히스토리 보기</a>
        <a href="ticket.html" class="btn line d-flex align-items-center justify-content-center gap-1" style="flex:1">
          <i data-lucide="ticket"></i>기념 티켓
        </a>
      </div>
    </div>


<!-- 커스텀 탭 버튼 (표준 JS 제어) -->
    <div class="custom-tabbar" role="tablist">
      <button type="button" class="custom-tab-btn active" data-target="#complete-tab-record">기록 1</button>
      <button type="button" class="custom-tab-btn" data-target="#complete-tab-review">내 감상평</button>
    </div>

    <!-- 탭 본문 영역 -->
    <!-- 탭 1: 기록 패널 -->
    <div id="complete-tab-record" class="custom-panel active">
      <div class="card">
        <div class="d-flex align-items-center gap-2 small mb-2">
          <span class="page">p.142</span>
          <b>민지</b>
          <span class="muted">9월 7일</span>
        </div>
        <p style="margin-top:10px">윤재가 처음 웃는 순간.</p>
        <form class="d-flex align-items-center gap-2 mt-2">
          <input class="input flex-grow-1" style="margin:0;padding:9px 12px;font-size:12px" placeholder="댓글 달기">
          <button class="btn line" style="width:auto;flex-shrink:0;white-space:nowrap;padding:9px 14px;font-size:12px">등록</button>
        </form>
      </div>
    </div>

    <!-- 탭 2: 내 감상평 패널 -->
    <div id="complete-tab-review" class="custom-panel">
      <div class="card stack">
        <div>
          <p class="field mb-1">별점</p>
          <span class="static-stars">★★★★<em>★</em></span>
        </div>
        <p class="serif" style="font-weight:700">감정을 배우는 소년의 성장기</p>
        <p class="quote">“누구나 각자의 방식으로 사랑한다”</p>
      </div>
    </div>
  </div>

  
  <nav class="bottom-nav">
    <a href="home.html"><i data-lucide="home"></i><span>홈</span></a>
    <a href="create.html"><i data-lucide="plus-circle"></i><span>방 만들기</span></a>
    <a href="shelf.html"><i data-lucide="book-marked"></i><span>내 서재</span></a>
  </nav>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  document.querySelectorAll('.custom-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.custom-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.custom-panel').forEach(panel => panel.classList.remove('active'));
      const targetPanel = document.querySelector(btn.dataset.target);
      if (targetPanel) {
        targetPanel.classList.add('active');
      }
    });
  });
</script>
</body>
</html>
