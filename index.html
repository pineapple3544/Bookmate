<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>책릴레이 · 로그인</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main class="app" style="padding-bottom:0">
<form id="signup" class="auth" action="home.html">
  <div class="logo"><i class="red"></i><i class="green"></i><i class="navy"></i><i class="ochre"></i></div>
  <h1 class="serif" style="font-size:30px;margin-top:12px">교환독서</h1>
  <p class="muted sm">한 권의 책, 여러 사람의 흔적</p>
  <div class="stack" style="margin-top:52px">
    <label class="field signup-only">닉네임<input class="input" placeholder="soiewer"></label>
    <label class="field">이메일<input class="input" type="email" placeholder="soiewer@naver.com"></label>
    <label class="field">비밀번호<input class="input" type="password"></label>
    <button class="btn login-only" type="submit">로그인</button>
    <button class="btn signup-only" type="submit">회원가입</button>
    <a class="link login-only" href="#signup">처음이신가요? 회원가입</a>
    <a class="link signup-only" href="#">이미 계정이 있나요? 로그인</a>
  </div>
</form>
</main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="interaction.js"></script>
</body></html>
